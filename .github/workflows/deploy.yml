name: FedGuard AI CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  # 1. Quality Assurance
  test-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install flake8 pytest
          
      - name: Lint with flake8
        run: |
          # stop the build if there are Python syntax errors or undefined names
          flake8 backend/app --count --select=E9,F63,F7,F82 --show-source --statistics
          # exit-zero treats all errors as warnings.
          flake8 backend/app --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

  # 2. Build Docker Images
  build-push-containers:
    needs: test-backend
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v3
      
      - name: Build Backend Image
        run: docker build -t fedguard-backend:latest ./backend
      
      # In a real scenario, we would push to ECR/DockerHub
      # - name: Push to Registry
      #   run: docker push myregistry/fedguard-backend:latest

  # 3. Deploy (Simulation)
  deploy:
    needs: build-push-containers
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Deploy to Production
        run: echo "Deploying to Kubernetes Cluster..."
        # run: kubectl apply -f k8s/
